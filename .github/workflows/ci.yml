name: .NET CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JoyGames.slnx

      - name: Build solution
        run: dotnet build JoyGames.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test JoyGames.slnx --no-build --configuration Release --verbosity normal